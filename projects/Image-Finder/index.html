<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Image Finder</h1>
        <div class="top">
            <input type="text" name="keyword" id="search" autofocus>
            <button id="btn1">Search</button>
        </div>
        <div class="images" id="card">
            <div class="placeholder">
                <h2>An Unplash API based simple web app to find images for any given keyword.<br>
                    Well you may not find images for every keyword but keeping that aside let's do some
                    searching...🔎🔎🚀🚀</h2>
            </div>
            <!-- <div class="card" id="card"> -->
        </div>
        <div class="foot">
            <button id="btn2">Load More...</button>
            <button id="btn3">Clear</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
