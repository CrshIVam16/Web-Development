<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">

        <div class="pwd_gen">
            <h2>Password Generator</h2>
            <div class="first">
                <div>
                    <input type="text" id="pswrd" placeholder="@^738bgh" min="10" max="20"></input>
                    <i class="fa-regular fa-copy" id="copy"></i>
                </div>

                <div>
                    <input type="range" id="slider" min="10" max="20">
                    <span id="percentage">10</span>
                </div>
            </div>

            <div class="second">
                <div>
                    <label for="uprcase">UpperCase</label>
                    <input type="checkbox" name="UpperCase" id="uprcase">
                </div>

                <div>
                    <label for="lwrcase">LowerCase</label>
                    <input type="checkbox" name="LowerCase" id="lwrcase">
                </div>

                <div>
                    <label for="num">Number</label>
                    <input type="checkbox" name="Number" id="num">
                </div>

                <div>
                    <label for="sym">Symbols</label>
                    <input type="checkbox" name="Symbol" id="sym">
                </div>

            </div>

            <div class="third">
                <button id="btn">Generate Password</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
